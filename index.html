<!doctype html>
<html lang="en" data-theme="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Faizan Ahmed Khan — Software Engineer</title>
  <meta name="description" content="Faizan Ahmed Khan — software engineer focused on backend, performance and offline sync. 3 years of production .NET at Epicor; MS Computer Engineering at NYU Tandon.">
  <meta property="og:title" content="Faizan Ahmed Khan — Software Engineer">
  <meta property="og:description" content="Backend · Performance · Offline sync · .NET & Python. Explore my work from an interactive terminal.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070a'/%3E%3Ctext x='10' y='44' font-family='monospace' font-size='34' font-weight='700' fill='%233dffa2'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="terminal">
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="crt" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" data-view-btn="terminal"><span class="accent">~/</span>faizan<span class="blink">_</span></a>
    <nav class="view-toggle" aria-label="View mode">
      <button type="button" data-view-btn="terminal" aria-pressed="true"><span class="accent">&gt;_</span> Terminal</button>
      <button type="button" data-view-btn="gui" aria-pressed="false">Recruiter view</button>
    </nav>
    <a class="resume-btn" href="assets/Faizan_Ahmed_Khan_Resume.pdf" target="_blank" rel="noopener">Résumé <span aria-hidden="true">↓</span></a>
  </header>

  <main>
    <section id="terminal-view" aria-label="Interactive terminal">
      <div class="window" id="terminal">
        <div class="titlebar">
          <span class="dots">
            <button type="button" class="dot red" data-dot="close" title="Close terminal → recruiter view" aria-label="Close terminal and open recruiter view"></button>
            <button type="button" class="dot yellow" data-dot="clear" title="Clear screen" aria-label="Clear screen"></button>
            <button type="button" class="dot green" data-dot="max" title="Toggle fullscreen" aria-label="Toggle fullscreen terminal"></button>
          </span>
          <span class="title">guest@faizan: ~ — zsh</span>
          <span class="title-r" id="clock"></span>
        </div>
        <div class="term-body" id="term-body">
          <div id="output" role="log" aria-live="polite"></div>
          <form id="cmd-form" class="input-line" autocomplete="off">
            <label for="cmd" class="prompt" id="prompt"></label>
            <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Type a command, for example help">
          </form>
        </div>
        <div class="chips" aria-label="Quick commands">
          <span class="chips-label">run&nbsp;→</span>
          <button type="button" class="chip" data-cmd="about">about</button>
          <button type="button" class="chip" data-cmd="focus">focus</button>
          <button type="button" class="chip" data-cmd="impact">impact</button>
          <button type="button" class="chip" data-cmd="experience">experience</button>
          <button type="button" class="chip" data-cmd="projects">projects</button>
          <button type="button" class="chip" data-cmd="skills">skills</button>
          <button type="button" class="chip" data-cmd="education">education</button>
          <button type="button" class="chip" data-cmd="contact">contact</button>
          <button type="button" class="chip" data-cmd="help">help</button>
        </div>
      </div>
      <p class="under-hint">Not a terminal person? <button type="button" class="link-btn" data-view-btn="gui">Open the recruiter view →</button></p>
    </section>

    <section id="gui-view" class="gui" aria-label="Recruiter view"></section>
  </main>

  <noscript>
    <p class="noscript">This site is interactive and needs JavaScript. You can <a href="assets/Faizan_Ahmed_Khan_Resume.pdf">download my résumé (PDF)</a> instead.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
